# Test settings: demo mode and every key blank, so every outside service is MOCK.
# Used by the Spring tests through @TestPropertySource(locations = "classpath:no-keys.properties").
#
# Why: when the app starts, it also reads the developer's own git-ignored .env file and real environment
# variables. Values in this file beat both, so these tests give the same result on every laptop, whatever
# keys or APP_MODE a teammate has set. (A test that needs other values sets its own, see EnvironmentVariablesTest.)
safarsaathi.mode=demo
safarsaathi.providers.gemini.api-key=
safarsaathi.providers.aerodatabox.api-key=
safarsaathi.providers.google-routes.api-key=
safarsaathi.providers.firebase.credentials-path=
safarsaathi.providers.google-calendar.credentials-path=
safarsaathi.providers.sarvam.api-key=
