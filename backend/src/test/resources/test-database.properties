# Test database: H2, a small database that lives in memory while the tests run. So ./mvnw test needs no Docker
# and no PostgreSQL, and a teammate's .env (DB_URL, DB_USERNAME, ...) can never point a test at a real database.
# Used by every Spring test through @TestPropertySource(locations = {..., "classpath:test-database.properties"}).
#
# Values here beat application.yml, .env and real environment variables, so every laptop gets the same result.
# Flyway creates the tables with the SAME migration files as in production, and the demo trips are seeded at
# startup, so the tests check the real SQL and the real seed file.
#
# The URL, part by part:
#   ${random.uuid}            a new name for each Spring test context, so each one gets its own empty database
#                             (one test changing data never surprises another one)
#   MODE=PostgreSQL           H2 behaves like PostgreSQL where it can
#   DATABASE_TO_LOWER=TRUE    table and column names in lower case, like PostgreSQL
#   DEFAULT_NULL_ORDERING=HIGH  NULLs sort last, like PostgreSQL
#   DB_CLOSE_DELAY=-1         keep the database while the test JVM runs, even if no connection is open for a moment
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The demo seed with its normal settings (fixed here so nothing outside the tests can change them).
safarsaathi.seed.enabled=true
safarsaathi.seed.day-offset=1
