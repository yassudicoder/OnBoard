# Read by ./mvnw (and mvnw.cmd on Windows). On the first run the wrapper downloads exactly this
# Maven version into ~/.m2/wrapper, so every teammate builds with the same Maven without installing it.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
