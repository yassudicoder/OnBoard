# Ask OnBoard lexicon: HINDI in Devanagari (e.g. "मेरा गेट कहाँ है?").
# Same format as lexicon_en.properties. Spelling variants of the nasal marks and the nukta dot are matched for you
# (कहाँ = कहां = कहा, फ़्लाइट = फ्लाइट, see AskText.java), so list each word once.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

GATE = गेट, गेट नंबर, द्वार
BOARDING = बोर्डिंग
CLOSE = बंद, बंद होगी, बंद होगा, लास्ट कॉल, आखिरी कॉल
START = शुरू, शुरु, चालू
WHEN = कब, कितने बजे, किस समय, कितनी देर, कब तक, टाइम, समय
WHERE = कहाँ, किधर, कहाँ पर
GO = जाना, जाऊँ, जाएँ, जाना है
FLIGHT = फ्लाइट, फ्लाईट, उड़ान, प्लेन, जहाज
STATUS = स्टेटस, स्थिति, क्या हुआ, अपडेट
DELAY = देर, देरी, लेट, विलंब, देर से
CANCEL = रद्द, कैंसल, कैंसिल
ON_TIME = समय पर, टाइम पर, सही समय पर
ARRIVE = पहुँचेगी, पहुँचेगा, पहुँचेंगे, उतरेगी, लैंड, लैंडिंग, पहुँचना
CONNECTION = कनेक्शन, कनेक्टिंग, कनेक्टिंग फ्लाइट, अगली फ्लाइट, ट्रांजिट
MISS = छूट, छूटेगी, छूट जाएगी, मिस
BAG = बैग, सामान, लगेज, बैगेज, अटैची
BELT = बेल्ट, बेल्ट नंबर
COLLECT = मिलेगा, मिलेगी, मिलेंगे, लेना, उठाना
NEXT = आगे, अगला कदम, अब क्या
WHAT_TO_DO = क्या करूँ, क्या करना है, क्या करना, क्या करें
DOCUMENT = दस्तावेज़, कागज़ात, कागज़
PASSPORT = पासपोर्ट
VISA = वीज़ा, विज़ा
EXPIRY = ख़त्म, खतम, समाप्त, एक्सपायर, वैध, वैधता, मान्य
WASHROOM = शौचालय, टॉयलेट, वॉशरूम, बाथरूम
HELP_DESK = हेल्प डेस्क, सहायता डेस्क, सूचना डेस्क, पूछताछ, सहायता केंद्र
LIFT = लिफ्ट, एलिवेटर
HELP = मदद, सहायता, हेल्प
HOTEL = होटल, रुकने की जगह
CAB = कैब, टैक्सी, गाड़ी, उबर, ओला
SEARCH = ढूँढो, खोजो, सबसे सस्ता, सबसे अच्छी, कोई और, दूसरी
BOOK = बुक, बुकिंग

MARKERS = है, हैं, कहाँ, मेरा, मेरी, मेरे, मुझे, क्या, कब, कितने, बजे, होगा, होगी, कौन, कौनसा, किधर, चाहिए, गया, गई, अब, और, कैसे, हूँ, जाएगी, अभी
