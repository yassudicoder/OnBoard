# ---- Other questions ----
help.menu = मी हे प्रश्न तुमच्या फोनवरच, इंटरनेटशिवायसुद्धा, सांगू शकतो: तुमचे गेट, बोर्डिंगची वेळ, फ्लाइटची स्थिती, कनेक्शन, तुमची बॅग आणि बेल्ट, बॅग तुटली किंवा उशिरा आली तर काय करायचे, हरवलेल्या वस्तू, पुढे काय करायचे, आणि टर्मिनल 2 मध्ये स्वच्छतागृहे, खाण्याची ठिकाणे, सुरक्षा तपासणी, चेक-इन, मदत कक्ष आणि लिफ्ट कुठे आहेत.
cloud.search = मी फोनवर फ्लाइट किंवा हॉटेल शोधू शकत नाही. त्यासाठी ऑनलाइन असिस्टंट लागतो, जो अजून चालू नाही.
cloud.cab = कॅबसाठी होमवरील राइड बटणे वापरा: ती ठिकाणे भरून Uber उघडतात.
unknown = माफ करा, याचे उत्तर मी अजून फोनवर देऊ शकत नाही. असे विचारा: "माझे गेट कुठे आहे?", "माझी फ्लाइट वेळेवर आहे का?", "माझी बॅग तुटली", "माझी वस्तू हरवली" किंवा "जेवण कुठे मिळेल?"

