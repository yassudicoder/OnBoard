assist.wheelchair = OnBoard व्हीलचेअर बुक करू शकत नाही. तुमच्या एअरलाइनकडे मागा: बुकिंग करताना किंवा चेक-इनला सर्वात चांगले.
assist.desk = तुम्ही मदत कक्षातही विचारू शकता. डेमो नकाशावर: {place}.
rules.carry = तुम्ही सोबत काय नेऊ शकता याचे तपासलेले नियम अजून माझ्याकडे नाहीत, म्हणून मी अंदाज लावणार नाही. कृपया तुमच्या एअरलाइनला किंवा सुरक्षा कर्मचाऱ्यांना विचारा.
