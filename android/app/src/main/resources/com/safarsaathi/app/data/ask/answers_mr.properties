# Ask OnBoard Quick answers: MARATHI (Devanagari). Same keys and {placeholders} as answers_en.properties.
# Also used for Marathi typed in English letters ("Majhi bag kuthe aahe?").
# {name} = a value the app's code puts in from saved data. Never write a gate, time or belt here yourself.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

# ---- The trip itself ----
trip.missing = तुमचा प्रवास अजून या फोनवर सेव्ह झालेला नाही. इंटरनेट चालू असताना एकदा होम उघडा.
flight.none = तुमच्या सेव्ह केलेल्या प्रवासात कोणतीही फ्लाइट नाही.
flight.on_plan = फ्लाइट {flight} {departs} वाजता सुटेल आणि {arrives} वाजता पोहोचेल. तुमच्या सेव्ह केलेल्या योजनेत काहीही बदल नाही.
flight.delayed = फ्लाइट {flight} उशिरा आहे: आता ती {departs} वाजता सुटेल (आधी {planned} होती) आणि {arrives} वाजता पोहोचेल.
flight.changed = फ्लाइट {flight} मध्ये बदल झाला आहे: आता ती {departs} वाजता सुटेल आणि {arrives} वाजता पोहोचेल.
flight.needs_you = फ्लाइट {flight} मध्ये बदल झाला आहे आणि तुमचा निर्णय हवा आहे. निवडण्यासाठी होम उघडा.
flight.cancelled = फ्लाइट {flight} रद्द झाली आहे. पुढे काय करता येईल ते होमवर पाहा.
flight.done = तुमच्या सेव्ह केलेल्या योजनेत फ्लाइट {flight} पूर्ण झाली आहे.

# ---- Gate and boarding ----
gate.known = तुमच्या फ्लाइट {flight} चे गेट {gate} आहे.
gate.changed = गेट बदलले आहे: फ्लाइट {flight} आता गेट {gate} वरून जाईल (आधी {previous} होते).
gate.not_announced = फ्लाइट {flight} चे गेट अजून जाहीर झालेले नाही. तुमची फ्लाइट {departs} वाजता सुटेल.
gate.boarding_close = बोर्डिंग {close} वाजता बंद होईल.
gate.boarding_close_estimate = बोर्डिंग साधारण {close} वाजता बंद होईल (अंदाज).
boarding.start = फ्लाइट {flight} चे बोर्डिंग {start} वाजता सुरू होईल.
boarding.start_estimate = फ्लाइट {flight} चे बोर्डिंग साधारण {start} वाजता सुरू होईल (अंदाज).
boarding.start_unknown = फ्लाइट {flight} च्या बोर्डिंगची वेळ अजून जाहीर झालेली नाही. तुमची फ्लाइट {departs} वाजता सुटेल.
boarding.close = फ्लाइट {flight} चे बोर्डिंग {close} वाजता बंद होईल.
boarding.close_estimate = फ्लाइट {flight} चे बोर्डिंग साधारण {close} वाजता बंद होईल (अंदाज).
boarding.close_unknown = फ्लाइट {flight} चे बोर्डिंग बंद होण्याची वेळ अजून जाहीर झालेली नाही. तुमची फ्लाइट {departs} वाजता सुटेल.

# ---- Connection ----
connection.none = तुमच्या सेव्ह केलेल्या प्रवासात फ्लाइट {flight} नंतर कोणतीही कनेक्टिंग फ्लाइट नाही.
connection.gap = फ्लाइट {flight} {arrives} वाजता पोहोचेल. फ्लाइट {next} {departs} वाजता सुटेल, म्हणजे मध्ये {gap} आहेत. विमानतळावर एवढा वेळ पुरेसा आहे की नाही हे फोन सांगू शकत नाही: एअरलाइनला विचारा.
connection.too_late = फ्लाइट {flight} आता {arrives} वाजता पोहोचेल, पण फ्लाइट {next} {departs} वाजताच सुटेल. तुमच्या कनेक्शनबद्दल एअरलाइनशी बोला.
connection.first_cancelled = फ्लाइट {flight} रद्द झाली आहे, म्हणून तुमच्या कनेक्टिंग फ्लाइट {next} बद्दल एअरलाइनला विचारा.

# ---- Bags ----
bag.none = या फोनवर अजून कोणतीही बॅग नोंदवलेली नाही. काउंटरवर देण्यापूर्वी Bags टॅबमध्ये ती नोंदवा.
bag.status = तुमची बॅग (टॅगचे शेवटचे अंक {tag}): {status}.
bag.status_REGISTERED = नोंदवली आहे, अजून काउंटरवर दिलेली नाही
bag.status_DROPPED = काउंटरवर दिली आहे
bag.status_LOADED = विमानात ठेवली आहे
bag.status_ARRIVED = तुमच्या फ्लाइटसोबत पोहोचली आहे
bag.status_ON_BELT = आता बेल्टवर आहे
bag.status_COLLECTED = घेतली आहे
bag.status_DELAYED = उशिरा येत आहे
bag.status_DAMAGED = खराब झाल्याची नोंद आहे
bag.status_MISSING = हरवल्याची नोंद आहे
belt.known = फ्लाइट {flight} च्या बॅगा बेल्ट {belt} वर येतील.
belt.unknown = फ्लाइट {flight} चा बॅगेज बेल्ट अजून जाहीर झालेला नाही. बॅगेज हॉलमधील स्क्रीनवर तुमचा फ्लाइट नंबर पाहा.

# ---- What next ----
next.airport = पुढे: फ्लाइट {flight} {departs} वाजता {from} येथून सुटेल. विमानतळावर: चेक-इन किंवा बॅग ड्रॉप, मग सुरक्षा तपासणी, मग तुमचे गेट.
next.airport_gate = पुढे: फ्लाइट {flight} {departs} वाजता {from} येथून सुटेल. विमानतळावर: चेक-इन किंवा बॅग ड्रॉप, मग सुरक्षा तपासणी, मग गेट {gate}.
next.block = तुमच्या प्रवासात पुढे: {title}, {time} वाजता.
next.nothing = तुमच्या सेव्ह केलेल्या प्रवासात पुढे काहीही नाही.

# ---- Documents ----
documents.vault = तुमची प्रवासाची कागदपत्रे डॉक्युमेंट व्हॉल्टमध्ये लॉक असतात, म्हणून मी ती इथे वाचत नाही. त्यांची मुदत पाहण्यासाठी Profile > More > Document vault उघडा.

# ---- Places in the terminal ----
where.header_WASHROOM = टर्मिनल 2 मधील स्वच्छतागृहे
where.header_HELP_DESK = टर्मिनल 2 मधील मदत कक्ष
where.header_LIFT = टर्मिनल 2 मधील लिफ्ट
where.closest_to_gate = (गेट {gate} च्या सर्वात जवळची आधी)
where.item = {name}, {near} जवळ ({floor}, {zone})
where.item_plain = {near} जवळ ({floor}, {zone})
where.item_no_near = {name} ({floor}, {zone})
where.demo_map = हे डेमो नकाशावरून आहे, विमानतळाचा अधिकृत नकाशा नाही.
where.none = हे टर्मिनल 2 च्या नकाशावर सापडले नाही.
where.no_map = टर्मिनल 2 चा नकाशा अजून या फोनवर नाही. तो आणण्यासाठी एकदा Navigate टॅब उघडा.
zone.after_security = सुरक्षा तपासणीनंतर
zone.before_security = सुरक्षा तपासणीपूर्वी
zone.arrivals_inside = बॅगेज हॉलच्या बाजूला
zone.arrivals_outside = बाहेर, निर्गमनानंतर
list.start = :
list.separator = ;
sentence.end = .

# ---- Other questions ----
help.menu = मी हे प्रश्न तुमच्या फोनवरच, इंटरनेटशिवायसुद्धा, सांगू शकतो: तुमचे गेट, बोर्डिंगची वेळ, फ्लाइटची स्थिती, कनेक्शन, तुमची बॅग आणि बेल्ट, पुढे काय करायचे, आणि टर्मिनल 2 मध्ये स्वच्छतागृहे, मदत कक्ष आणि लिफ्ट कुठे आहेत.
cloud.search = मी फोनवर फ्लाइट किंवा हॉटेल शोधू शकत नाही. त्यासाठी ऑनलाइन असिस्टंट लागतो, जो अजून चालू नाही.
cloud.cab = कॅबसाठी होमवरील राइड बटणे वापरा: ती ठिकाणे भरून Uber उघडतात.
unknown = माफ करा, मला समजले नाही. तुमचे गेट, बोर्डिंग, फ्लाइट, बॅग किंवा स्वच्छतागृह याबद्दल विचारा.

# ---- Times and durations ----
time.tomorrow = उद्या {time}
time.yesterday = काल {time}
time.other_day = {date} रोजी {time}
duration.h_m = {h} तास {m} मिनिटे
duration.h = {h} तास
duration.m = {m} मिनिटे

# ---- Labels around the answer ----
source.phone = तुमच्या फोनवर दिलेले उत्तर
source.as_of = {time} पर्यंतची माहिती
action.NAVIGATE = गेटपर्यंत मार्ग
action.OPEN_MAP = नकाशा उघडा
action.OPEN_BAGS = Bags उघडा
action.OPEN_VAULT = डॉक्युमेंट व्हॉल्ट उघडा
action.OPEN_HOME = होम उघडा
chip.gate = माझे गेट कोणते आहे?
chip.boarding_close = बोर्डिंग किती वाजता बंद होईल?
chip.bag = माझी बॅग कुठे आहे?
chip.flight = माझी फ्लाइट वेळेवर आहे का?
chip.washroom = स्वच्छतागृह कुठे आहे?
chip.next = आता पुढे काय करायचे?
