doc.OTHER = कागदपत्र
doc.for_country = {country}साठी {document}
doc.line = {document}: {validity}, {status}
doc.line_named = {document} ({name}): {validity}, {status}
doc.valid_until = {date} पर्यंत वैध
doc.no_date = तारीख सेव्ह केलेली नाही
status.READY = तयार
status.EXPIRES_SOON = लवकरच संपेल ({days} दिवस बाकी)
status.EXPIRED = मुदत संपली
status.MISMATCH = नाव प्रवासाशी जुळत नाही, तपासा
status.NOT_OFFLINE_YET = ऑफलाइन वापरासाठी अजून तपासलेले नाही
status.MISSING = सेव्ह केलेली फाइल या फोनवर सापडली नाही, पुन्हा जोडा

