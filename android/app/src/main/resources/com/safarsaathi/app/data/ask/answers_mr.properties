# ---- Added after the demo probe. Bag-problem and Lost & Found facts come from baggage-facts.json (sourced);
# {days}, {lostDays}, {name}, {location}, {hours}, {date} and {place} are filled in by QuickAnswerer. ----
greeting = नमस्कार! मी OnBoard आहे. तुमची फ्लाइट, गेट, बोर्डिंग, बॅग किंवा टर्मिनल 2 मधील एखाद्या ठिकाणाबद्दल विचारा.
thanks = तुमचे स्वागत आहे. तुमचा प्रवास सुखाचा होवो!
bag.problem_damaged = तुमच्या बॅगबद्दल वाईट वाटते. बॅगेज हॉलमधून बाहेर पडण्यापूर्वी ती एअरलाइनच्या बॅगेज कर्मचाऱ्यांना दाखवा आणि प्रॉपर्टी इररेग्युलॅरिटी रिपोर्ट (PIR) मागा; त्याचा संदर्भ क्रमांक ठेवा.
bag.problem_not_arrived = बॅगेज हॉलमधून बाहेर पडण्यापूर्वी तक्रार करा: एअरलाइनच्या बॅगेज कर्मचाऱ्यांकडे प्रॉपर्टी इररेग्युलॅरिटी रिपोर्ट (PIR) मागा आणि त्याचा संदर्भ क्रमांक ठेवा.
bag.problem_pilfered = बॅगेज हॉलमधून बाहेर पडण्यापूर्वी एअरलाइनच्या बॅगेज कर्मचाऱ्यांना काय गायब आहे ते सांगा आणि प्रॉपर्टी इररेग्युलॅरिटी रिपोर्ट (PIR) मागा; त्याचा संदर्भ क्रमांक ठेवा.
bag.deadline_damage = नंतर बॅग मिळाल्यापासून {days} दिवसांच्या आत एअरलाइनला लेखी कळवा.
bag.deadline_delay = नंतर बॅग मिळाल्यापासून {days} दिवसांच्या आत एअरलाइनला लेखी कळवा; {lost_days} दिवसांनंतरही आली नाही, तर ती हरवली म्हणून दावा करू शकता.
bag.deadline_pilfered = नंतर {days} दिवसांच्या आत एअरलाइनला लेखी कळवा (त्यांच्याकडून खात्री करा).
bag.deadline_note = (मॉन्ट्रियल कन्व्हेन्शन, आंतरराष्ट्रीय प्रवास; देशांतर्गत फ्लाइटसाठी एअरलाइनच्या अटी पाहा.)
bag.counter_where = डेमो नकाशावर: {place}.
bag.or_lost_found = टर्मिनलमध्ये कुठे राहिली? मला Lost & Found बद्दल विचारा.
bag.claim_help = Help टॅब प्रत्येक पायरी सांगतो आणि क्लेम पॅक तयार करतो.
lost.found = टर्मिनल 2 साठी {name}: {location}.
lost.hours = वेळ (विमानतळाच्या वेबसाइटवरून, इंग्रजीत): {hours}
lost.portal = विमानतळाच्या अधिकृत पोर्टलवर तक्रार करा; Lost & Found मार्गदर्शक तुमच्यासाठी माहिती भरतो.
