# Ask OnBoard lexicon: MARATHI in Devanagari (e.g. "माझी बॅग कुठे आहे?").
# Same format as lexicon_en.properties. Marathi glues endings onto words ("गेटवर", "फ्लाइटची"); Lexicon.java cuts the
# common ones off, so only the plain word needs listing here.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

GATE = गेट, गेट क्रमांक, गेट नंबर
BOARDING = बोर्डिंग
CLOSE = बंद, बंद होईल, बंद होणार
START = सुरू, सुरु, चालू
WHEN = कधी, केव्हा, किती वाजता, किती वेळ, वेळ, किती वाजेपर्यंत
WHERE = कुठे, कुठं, कोणत्या बाजूला
GO = जाऊ, जायचे, जायचं
FLIGHT = फ्लाइट, विमान
STATUS = स्थिती, स्टेटस, काय झाले, काय झालं, अपडेट
DELAY = उशीर, उशिरा, लेट, विलंब
CANCEL = रद्द, कॅन्सल
ON_TIME = वेळेवर, वेळेत
ARRIVE = पोहोचेल, पोचेल, उतरेल, लँड, पोहोचणार
CONNECTION = कनेक्शन, कनेक्टिंग, कनेक्टिंग फ्लाइट, पुढची फ्लाइट, ट्रान्झिट
MISS = चुकेल, चुकणार, चुकली, मिस
BAG = बॅग, बॅगा, बॅगेज, सामान, लगेज
BELT = बेल्ट
COLLECT = मिळेल, मिळणार, घ्यायची, घ्यायचे
NEXT = पुढे, पुढचे, पुढची पायरी, आता काय
WHAT_TO_DO = काय करू, काय करायचे, काय करायचं, काय करावे
DOCUMENT = कागदपत्रे, कागदपत्र, दस्तऐवज
PASSPORT = पासपोर्ट
VISA = व्हिसा, विसा
EXPIRY = संपेल, संपतो, संपते, मुदत, वैध, समाप्त, एक्सपायर
WASHROOM = स्वच्छतागृह, शौचालय, टॉयलेट, वॉशरूम, बाथरूम, मुतारी
HELP_DESK = मदत कक्ष, माहिती कक्ष, चौकशी, हेल्प डेस्क
LIFT = लिफ्ट
HELP = मदत, सहाय्य
HOTEL = हॉटेल, राहण्याची जागा
CAB = कॅब, टॅक्सी, गाडी, रिक्षा, उबर
SEARCH = शोधा, शोधून, स्वस्त, दुसरी, दुसरे
BOOK = बुक, बुकिंग

MARKERS = आहे, आहेत, कुठे, माझा, माझी, माझे, माझ्या, मला, काय, कधी, किती, वाजता, होईल, होणार, येईल, झाले, झाली, आता, पुढे, कोणता, कोणते, कोणती, कोणत्या, केव्हा, हवी, हवे, पाहिजे, तुमचा, तुमची, शोधा, हॉटेल
