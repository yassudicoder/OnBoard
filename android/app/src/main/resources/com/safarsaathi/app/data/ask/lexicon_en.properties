# Ask OnBoard lexicon: ENGLISH.
# One line per concept (see Concept.java): the words or short phrases (up to 4 words) that mean it, separated by commas.
# Case and punctuation don't matter. Words of 5+ letters also match with one small typo ("bording"), so typos need not
# be listed. A phrase may appear under two concepts. MARKERS = everyday words that show the question is in English.
# The same concepts are looked up in ALL lexicon files at once, because travellers mix languages.

GATE = gate, gates, gate number, gate no, boarding gate
BOARDING = boarding, board, boards
CLOSE = close, closes, closing, closed, last call, final call, shut, shuts
START = start, starts, starting, begin, begins, open, opens
WHEN = when, what time, time, how long, by when, at what time, how much time
WHERE = where, which way, how do i get, how to get to, way to, where is, where are, nearest, closest
GO = go, going, head, walk
FLIGHT = flight, flights, plane, my flight
STATUS = status, update, updates, news, info
DELAY = delay, delayed, delays, late, running late, behind schedule
CANCEL = cancel, cancelled, canceled, cancellation
ON_TIME = on time, on schedule
ARRIVE = land, lands, landing, arrive, arrives, arriving, arrival, reach, reaches
CONNECTION = connection, connecting, connecting flight, transfer, layover, transit, onward flight, next leg
MISS = miss, missed, missing, make it
BAG = bag, bags, baggage, luggage, suitcase, suitcases, checked bag, baggage claim
BELT = belt, carousel, baggage belt, belt number, conveyor
COLLECT = collect, pick up, claim, baggage claim
NEXT = next, next step, now what, after this, then what
WHAT_TO_DO = what should i do, what do i do, what to do, what do i need, what now, what next
DOCUMENT = document, documents, papers, travel documents, id
PASSPORT = passport
VISA = visa, e visa, evisa, transit visa
EXPIRY = expire, expires, expiry, expiring, expired, valid, validity, valid till, valid until
WASHROOM = washroom, washrooms, toilet, toilets, restroom, restrooms, rest room, bathroom, loo, lavatory, wc, gents, ladies
HELP_DESK = help desk, helpdesk, information desk, info desk, information counter, enquiry, inquiry, customer service
LIFT = lift, lifts, elevator, elevators
HELP = help, assist, assistance, support, what can you do, how does this work
HOTEL = hotel, hotels, place to stay, accommodation
CAB = cab, cabs, taxi, uber, ola, ride
SEARCH = find, search, look for, best, cheapest, fastest, another, other flights, alternative, alternatives
BOOK = book, booking, reserve

MARKERS = the, is, my, where, when, what, does, do, will, i, a, an, of, for, are, how, which, can, should, near, it, at, there
