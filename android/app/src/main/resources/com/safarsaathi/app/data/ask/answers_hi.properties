# Ask OnBoard Quick answers: HINDI (Devanagari). Same keys and {placeholders} as answers_en.properties.
# {name} = a value the app's code puts in from saved data. Never write a gate, time or belt here yourself.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

# ---- The trip itself ----
trip.missing = आपकी यात्रा अभी इस फ़ोन पर सेव नहीं है। इंटरनेट चालू होने पर एक बार होम खोलें।
flight.none = आपकी सेव की गई यात्रा में कोई फ्लाइट नहीं है।
flight.on_plan = फ्लाइट {flight} {departs} पर रवाना होगी और {arrives} पर पहुँचेगी। आपकी सेव की गई योजना में कोई बदलाव नहीं है।
flight.delayed = फ्लाइट {flight} देर से है: अब यह {departs} पर रवाना होगी (पहले {planned} थी) और {arrives} पर पहुँचेगी।
flight.changed = फ्लाइट {flight} में बदलाव हुआ है: अब यह {departs} पर रवाना होगी और {arrives} पर पहुँचेगी।
flight.needs_you = फ्लाइट {flight} में बदलाव हुआ है और आपका फ़ैसला चाहिए। चुनने के लिए होम खोलें।
flight.cancelled = फ्लाइट {flight} रद्द हो गई है। आगे क्या कर सकते हैं, यह होम पर देखें।
flight.done = आपकी सेव की गई योजना में फ्लाइट {flight} पूरी हो चुकी है।

# ---- Gate and boarding ----
gate.known = आपकी फ्लाइट {flight} का गेट {gate} है।
gate.changed = गेट बदल गया है: फ्लाइट {flight} अब गेट {gate} से जाएगी (पहले {previous} था)।
gate.not_announced = फ्लाइट {flight} का गेट अभी घोषित नहीं हुआ है। आपकी फ्लाइट {departs} पर रवाना होगी।
gate.boarding_close = बोर्डिंग {close} पर बंद होगी।
gate.boarding_close_estimate = बोर्डिंग लगभग {close} पर बंद होगी (अनुमान)।
boarding.start = फ्लाइट {flight} की बोर्डिंग {start} पर शुरू होगी।
boarding.start_estimate = फ्लाइट {flight} की बोर्डिंग लगभग {start} पर शुरू होगी (अनुमान)।
boarding.start_unknown = फ्लाइट {flight} की बोर्डिंग का समय अभी घोषित नहीं हुआ है। आपकी फ्लाइट {departs} पर रवाना होगी।
boarding.close = फ्लाइट {flight} की बोर्डिंग {close} पर बंद होगी।
boarding.close_estimate = फ्लाइट {flight} की बोर्डिंग लगभग {close} पर बंद होगी (अनुमान)।
boarding.close_unknown = फ्लाइट {flight} की बोर्डिंग बंद होने का समय अभी घोषित नहीं हुआ है। आपकी फ्लाइट {departs} पर रवाना होगी।

# ---- Connection ----
connection.none = आपकी सेव की गई यात्रा में फ्लाइट {flight} के बाद कोई कनेक्टिंग फ्लाइट नहीं है।
connection.gap = फ्लाइट {flight} {arrives} पर पहुँचेगी। फ्लाइट {next} {departs} पर रवाना होगी, यानी बीच में {gap} हैं। यह समय एयरपोर्ट पर काफ़ी है या नहीं, यह फ़ोन नहीं बता सकता: एयरलाइन से पूछें।
connection.too_late = फ्लाइट {flight} अब {arrives} पर पहुँचेगी, जबकि फ्लाइट {next} {departs} पर रवाना हो जाएगी। अपने कनेक्शन के बारे में एयरलाइन से बात करें।
connection.first_cancelled = फ्लाइट {flight} रद्द हो गई है, इसलिए अपनी कनेक्टिंग फ्लाइट {next} के बारे में एयरलाइन से पूछें।

# ---- Bags ----
bag.none = इस फ़ोन पर अभी कोई बैग रजिस्टर नहीं है। काउंटर पर देने से पहले बैग्स टैब में उसे रजिस्टर करें।
bag.status = आपका बैग (टैग के आख़िरी अंक {tag}): {status}।
bag.status_REGISTERED = रजिस्टर है, अभी काउंटर पर नहीं दिया
bag.status_DROPPED = काउंटर पर दे दिया गया
bag.status_LOADED = विमान में रख दिया गया
bag.status_ARRIVED = आपकी फ्लाइट के साथ पहुँच गया
bag.status_ON_BELT = अभी बेल्ट पर है
bag.status_COLLECTED = ले लिया गया
bag.status_DELAYED = देर से आ रहा है
bag.status_DAMAGED = ख़राब होने की रिपोर्ट हुई है
bag.status_MISSING = गुम होने की रिपोर्ट हुई है
belt.known = फ्लाइट {flight} के बैग बेल्ट {belt} पर आएँगे।
belt.unknown = फ्लाइट {flight} का बैगेज बेल्ट अभी घोषित नहीं हुआ है। बैगेज हॉल की स्क्रीन पर अपना फ्लाइट नंबर देखें।

# ---- What next ----
next.airport = आगे: फ्लाइट {flight} {departs} पर {from} से रवाना होगी। एयरपोर्ट पर: चेक-इन या बैग ड्रॉप, फिर सुरक्षा जांच, फिर अपना गेट।
next.airport_gate = आगे: फ्लाइट {flight} {departs} पर {from} से रवाना होगी। एयरपोर्ट पर: चेक-इन या बैग ड्रॉप, फिर सुरक्षा जांच, फिर गेट {gate}।
next.block = आपकी यात्रा में आगे: {title}, {time} पर।
next.nothing = आपकी सेव की गई यात्रा में आगे कुछ और नहीं है।

# ---- Documents: summaries from the Document Vault (type, first name, dates, countries, status; never numbers) ----
documents.not_available = इस फ़ोन पर अभी डॉक्यूमेंट वॉल्ट नहीं है, इसलिए मैं आपके दस्तावेज़ नहीं देख सकता।
documents.locked = आपका डॉक्यूमेंट वॉल्ट लॉक है। इसे देखने के लिए वॉल्ट अनलॉक करें।
documents.your_vault = आपका वॉल्ट
documents.none_of_type = {trip} में कोई {document} सेव नहीं है।
documents.all_ready = {trip} में सेव किए गए सभी {count} दस्तावेज़ तैयार हैं।
documents.attention = {trip} में इन पर ध्यान दें: {items}
documents.list = {trip} में: {items}
documents.sample = SAMPLE
documents.requirements_note = किसी देश के लिए कौन-से दस्तावेज़ ज़रूरी हैं, यह मैं नहीं बता सकता: एयरलाइन या दूतावास से पूछें।
doc.kind_PASSPORT = पासपोर्ट
doc.kind_VISA = वीज़ा
doc.kind_INSURANCE = यात्रा बीमा
doc.PASSPORT = पासपोर्ट
doc.ID_CARD = पहचान पत्र
doc.VISA = वीज़ा
doc.E_VISA = ई-वीज़ा
doc.TRANSIT_VISA = ट्रांज़िट वीज़ा
doc.ENTRY_FORM = प्रवेश फ़ॉर्म
doc.TICKET = टिकट
doc.BOARDING_PASS = बोर्डिंग पास
doc.HOTEL = होटल बुकिंग
doc.INSURANCE = यात्रा बीमा
doc.VACCINATION_CERT = टीकाकरण प्रमाणपत्र
doc.OTHER = दस्तावेज़
doc.for_country = {country} के लिए {document}
doc.line = {document}: {validity}, {status}
doc.line_named = {document} ({name}): {validity}, {status}
doc.valid_until = {date} तक वैध
doc.no_date = कोई तारीख़ सेव नहीं
status.READY = तैयार
status.EXPIRES_SOON = जल्द समाप्त ({days} दिन बाकी)
status.EXPIRED = समाप्त हो चुका
status.MISMATCH = नाम यात्रा से मेल नहीं खाता, जांच लें
status.NOT_OFFLINE_YET = ऑफ़लाइन उपयोग के लिए अभी जांचा नहीं गया
status.MISSING = सेव की गई फ़ाइल इस फ़ोन पर नहीं मिली, फिर से जोड़ें

# ---- Places in the terminal ----
where.header_WASHROOM = टर्मिनल 2 में शौचालय
where.header_HELP_DESK = टर्मिनल 2 में सहायता डेस्क
where.header_LIFT = टर्मिनल 2 में लिफ्ट
where.closest_to_gate = (गेट {gate} के सबसे पास वाले पहले)
where.item = {name}, {near} के पास ({floor}, {zone})
where.item_plain = {near} के पास ({floor}, {zone})
where.item_no_near = {name} ({floor}, {zone})
where.demo_map = यह डेमो नक्शे से है, एयरपोर्ट का आधिकारिक नक्शा नहीं।
where.none = यह टर्मिनल 2 के नक्शे पर नहीं मिला।
where.no_map = टर्मिनल 2 का नक्शा अभी इस फ़ोन पर नहीं है। उसे लाने के लिए एक बार Navigate टैब खोलें।
zone.after_security = सुरक्षा जांच के बाद
zone.before_security = सुरक्षा जांच से पहले
zone.arrivals_inside = बैगेज हॉल की तरफ़
zone.arrivals_outside = बाहर, निकास के बाद
list.start = :
list.separator = ;
sentence.end = ।

# ---- Other questions ----
help.menu = मैं ये सवाल आपके फ़ोन पर ही, बिना इंटरनेट के भी, बता सकता हूँ: आपका गेट, बोर्डिंग का समय, फ्लाइट की स्थिति, कनेक्शन, आपका बैग और बेल्ट, आगे क्या करना है, और टर्मिनल 2 में शौचालय, सहायता डेस्क और लिफ्ट कहाँ हैं।
cloud.search = मैं फ़ोन पर फ्लाइट या होटल नहीं खोज सकता। इसके लिए ऑनलाइन असिस्टेंट चाहिए, जो अभी चालू नहीं है।
cloud.cab = कैब के लिए होम पर राइड बटन इस्तेमाल करें: वे जगहें भरकर Uber खोलते हैं।
unknown = माफ़ कीजिए, मैं समझ नहीं पाया। अपने गेट, बोर्डिंग, फ्लाइट, बैग या शौचालय के बारे में पूछें।

