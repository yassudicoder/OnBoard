# ---- Added after the demo probe. Bag-problem and Lost & Found facts come from baggage-facts.json (sourced);
# {days}, {lostDays}, {name}, {location}, {hours}, {date} and {place} are filled in by QuickAnswerer. ----
greeting = नमस्ते! मैं OnBoard हूँ। अपनी फ्लाइट, गेट, बोर्डिंग, बैग या टर्मिनल 2 में किसी जगह के बारे में पूछें।
thanks = आपका स्वागत है। आपकी यात्रा शुभ हो!
bag.problem_damaged = आपके बैग के लिए खेद है। बैगेज हॉल से निकलने से पहले इसे एयरलाइन के बैगेज स्टाफ को दिखाएँ और प्रॉपर्टी इररेगुलैरिटी रिपोर्ट (PIR) माँगें; उसका रेफरेंस नंबर रखें।
bag.problem_not_arrived = बैगेज हॉल से निकलने से पहले रिपोर्ट करें: एयरलाइन के बैगेज स्टाफ से प्रॉपर्टी इररेगुलैरिटी रिपोर्ट (PIR) माँगें और उसका रेफरेंस नंबर रखें।
bag.problem_pilfered = बैगेज हॉल से निकलने से पहले एयरलाइन के बैगेज स्टाफ को बताएँ कि क्या गायब है और प्रॉपर्टी इररेगुलैरिटी रिपोर्ट (PIR) माँगें; उसका रेफरेंस नंबर रखें।
bag.deadline_damage = फिर बैग मिलने के {days} दिनों के अंदर एयरलाइन को लिखें।
bag.deadline_delay = फिर बैग मिलने के {days} दिनों के अंदर एयरलाइन को लिखें; अगर {lost_days} दिन बाद भी नहीं आया, तो आप उसे खोया हुआ मानकर दावा कर सकते हैं।
bag.deadline_pilfered = फिर {days} दिनों के अंदर एयरलाइन को लिखें (उनसे पुष्टि करें)।
bag.deadline_note = (मॉन्ट्रियल कन्वेंशन, अंतरराष्ट्रीय यात्रा; घरेलू उड़ानों के लिए एयरलाइन की शर्तें देखें।)
bag.counter_where = डेमो नक्शे पर: {place}।
bag.or_lost_found = टर्मिनल में कहीं छूट गया? मुझसे खोया-पाया (Lost & Found) के बारे में पूछें।
bag.claim_help = Help टैब हर कदम बताता है और क्लेम पैक बनाता है।
lost.found = टर्मिनल 2 के लिए {name}: {location}।
lost.hours = समय (एयरपोर्ट की वेबसाइट से, अंग्रेज़ी में): {hours}
lost.portal = एयरपोर्ट के आधिकारिक पोर्टल पर रिपोर्ट करें; Lost & Found गाइड आपके लिए जानकारी भर देता है।
lost.plane = विमान में खोया? एयरलाइन से संपर्क करें।
lost.source = (एयरपोर्ट की वेबसाइट, {date} को जाँचा गया।)
lost.no_facts = एयरपोर्ट पर कुछ खो गया? Lost & Found गाइड खोलें: वह बताता है कहाँ जाना है और आपके लिए रिपोर्ट भर देता है।
assist.wheelchair = OnBoard व्हीलचेयर बुक नहीं कर सकता। अपनी एयरलाइन से माँगें: बुकिंग के समय या चेक-इन पर सबसे अच्छा है।
assist.desk = आप सहायता डेस्क पर भी पूछ सकते हैं। डेमो नक्शे पर: {place}।
rules.carry = आप क्या साथ ले जा सकते हैं, इसके जाँचे हुए नियम अभी मेरे पास नहीं हैं, इसलिए मैं अंदाज़ा नहीं लगाऊँगा। कृपया अपनी एयरलाइन या सुरक्षा स्टाफ से पूछें।
rules.allowance = आपका बैगेज अलाउंस इस फ़ोन पर सेव नहीं है। यह आपके टिकट या ई-टिकट पर और एयरलाइन की वेबसाइट पर होता है।
