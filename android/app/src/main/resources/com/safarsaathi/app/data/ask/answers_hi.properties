# ---- Other questions ----
help.menu = मैं ये सवाल आपके फ़ोन पर ही, बिना इंटरनेट के भी, बता सकता हूँ: आपका गेट, बोर्डिंग का समय, फ्लाइट की स्थिति, कनेक्शन, आपका बैग और बेल्ट, बैग टूटने या देर से आने पर क्या करें, खोया-पाया, आगे क्या करना है, और टर्मिनल 2 में शौचालय, खाना, सुरक्षा जांच, चेक-इन, सहायता डेस्क और लिफ्ट कहाँ हैं।
cloud.search = मैं फ़ोन पर फ्लाइट या होटल नहीं खोज सकता। इसके लिए ऑनलाइन असिस्टेंट चाहिए, जो अभी चालू नहीं है।
cloud.cab = कैब के लिए होम पर राइड बटन इस्तेमाल करें: वे जगहें भरकर Uber खोलते हैं।
unknown = माफ़ कीजिए, इसका जवाब मैं अभी फ़ोन पर नहीं दे सकता। ऐसे पूछें: "मेरा गेट कहाँ है?", "क्या मेरी फ्लाइट समय पर है?", "मेरा बैग टूट गया", "मेरा सामान खो गया" या "खाना कहाँ मिलेगा?"

