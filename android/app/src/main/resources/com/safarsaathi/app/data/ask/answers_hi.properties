there.flight_no_from = फ्लाइट {flight} {departs} पर रवाना होगी।
there.directions = रास्ते के लिए होम पर दिशाएँ खोलें (Google Maps में); वहाँ राइड बटन निकलने का समय (अनुमान) दिखाता है। कितनी जल्दी पहुँचना है, इसके लिए एयरलाइन की सलाह मानें।
