# Ask OnBoard Quick answers: HINGLISH (Hindi in English letters, for travellers who ask that way).
# Same keys and {placeholders} as answers_en.properties. Never write a gate, time or belt here yourself.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

# ---- The trip itself ----
trip.missing = Aapki trip abhi is phone par save nahi hai. Internet chalu hone par ek baar Home kholiye.
flight.none = Aapki saved trip mein koi flight nahi hai.
flight.on_plan = Flight {flight} {departs} baje nikalegi aur {arrives} baje pahunchegi. Aapke saved plan mein koi badlav nahi hai.
flight.delayed = Flight {flight} late hai: ab {departs} baje nikalegi (pehle {planned} thi) aur {arrives} baje pahunchegi.
flight.changed = Flight {flight} mein badlav hua hai: ab {departs} baje nikalegi aur {arrives} baje pahunchegi.
flight.needs_you = Flight {flight} mein badlav hua hai aur aapka faisla chahiye. Chunne ke liye Home kholiye.
flight.cancelled = Flight {flight} cancel ho gayi hai. Aage kya kar sakte hain, Home par dekhiye.
flight.done = Aapke saved plan mein flight {flight} poori ho chuki hai.

# ---- Gate and boarding ----
gate.known = Aapki flight {flight} ka gate {gate} hai.
gate.changed = Gate badal gaya hai: flight {flight} ab gate {gate} se jayegi (pehle {previous} tha).
gate.not_announced = Flight {flight} ka gate abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.
gate.boarding_close = Boarding {close} baje band hogi.
gate.boarding_close_estimate = Boarding lagbhag {close} baje band hogi (estimate).
boarding.start = Flight {flight} ki boarding {start} baje shuru hogi.
boarding.start_estimate = Flight {flight} ki boarding lagbhag {start} baje shuru hogi (estimate).
boarding.start_unknown = Flight {flight} ki boarding ka time abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.
boarding.close = Flight {flight} ki boarding {close} baje band hogi.
boarding.close_estimate = Flight {flight} ki boarding lagbhag {close} baje band hogi (estimate).
boarding.close_unknown = Flight {flight} ki boarding band hone ka time abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.

# ---- Connection ----
connection.none = Aapki saved trip mein flight {flight} ke baad koi connecting flight nahi hai.
connection.gap = Flight {flight} {arrives} baje pahunchegi. Flight {next} {departs} baje nikalegi, yaani beech mein {gap} hain. Airport par itna time kaafi hai ya nahi, yeh phone nahi bata sakta: airline se poochhiye.
connection.too_late = Flight {flight} ab {arrives} baje pahunchegi, jabki flight {next} {departs} baje nikal jayegi. Apne connection ke baare mein airline se baat kijiye.
connection.first_cancelled = Flight {flight} cancel ho gayi hai, isliye apni connecting flight {next} ke baare mein airline se poochhiye.

# ---- Bags ----
bag.none = Is phone par abhi koi bag register nahi hai. Counter par dene se pehle Bags tab mein register kijiye.
bag.status = Aapka bag (tag ke aakhri ank {tag}): {status}.
bag.status_REGISTERED = register hai, abhi counter par nahi diya
bag.status_DROPPED = counter par de diya gaya
bag.status_LOADED = plane mein rakh diya gaya
bag.status_ARRIVED = aapki flight ke saath pahunch gaya
bag.status_ON_BELT = abhi belt par hai
bag.status_COLLECTED = le liya gaya
bag.status_DELAYED = late aa raha hai
bag.status_DAMAGED = kharab hone ki report hui hai
bag.status_MISSING = gum hone ki report hui hai
belt.known = Flight {flight} ke bag belt {belt} par aayenge.
belt.unknown = Flight {flight} ka baggage belt abhi announce nahi hua hai. Baggage hall ki screen par apna flight number dekhiye.

# ---- What next ----
next.airport = Aage: flight {flight} {departs} baje {from} se nikalegi. Airport par: check-in ya bag drop, phir security, phir apna gate.
next.airport_gate = Aage: flight {flight} {departs} baje {from} se nikalegi. Airport par: check-in ya bag drop, phir security, phir gate {gate}.
next.block = Aapki trip mein aage: {title}, {time} baje.
next.nothing = Aapki saved trip mein aage kuch aur nahi hai.

# ---- Documents: summaries from the Document Vault (type, first name, dates, countries, status; never numbers) ----
documents.not_available = Is phone par abhi Document Vault nahi hai, isliye main aapke documents nahi dekh sakta.
documents.locked = Aapka Document Vault lock hai. Ise dekhne ke liye vault unlock kijiye.
documents.your_vault = aapka vault
documents.none_of_type = {trip} mein koi {document} save nahi hai.
documents.all_ready = {trip} mein save kiye gaye saare {count} documents ready hain.
documents.attention = {trip} mein inpar dhyan dijiye: {items}
documents.list = {trip} mein: {items}
documents.sample = SAMPLE
documents.requirements_note = Kisi desh ke liye kaun se documents zaroori hain, yeh main nahi bata sakta: airline ya embassy se poochhiye.
doc.kind_PASSPORT = passport
doc.kind_VISA = visa
doc.kind_INSURANCE = travel insurance
doc.PASSPORT = Passport
doc.ID_CARD = ID card
doc.VISA = Visa
doc.E_VISA = E-visa
doc.TRANSIT_VISA = Transit visa
doc.ENTRY_FORM = Entry form
doc.TICKET = Ticket
doc.BOARDING_PASS = Boarding pass
doc.HOTEL = Hotel booking
doc.INSURANCE = Travel insurance
doc.VACCINATION_CERT = Vaccination certificate
doc.OTHER = Document
doc.for_country = {country} ke liye {document}
doc.line = {document}: {validity}, {status}
doc.line_named = {document} ({name}): {validity}, {status}
doc.valid_until = {date} tak valid
doc.no_date = koi date save nahi
status.READY = ready
status.EXPIRES_SOON = jaldi expire hoga ({days} din baaki)
status.EXPIRED = expire ho chuka
status.MISMATCH = naam trip se match nahi karta, check kijiye
status.NOT_OFFLINE_YET = offline use ke liye abhi check nahi hua
status.MISSING = save ki hui file is phone par nahi mili, dobara jodiye

# ---- Places in the terminal ----
where.header_WASHROOM = Terminal 2 mein washroom
where.header_HELP_DESK = Terminal 2 mein help desk
where.header_LIFT = Terminal 2 mein lift
where.closest_to_gate = (gate {gate} ke sabse paas wale pehle)
where.item = {name}, {near} ke paas ({floor}, {zone})
where.item_plain = {near} ke paas ({floor}, {zone})
where.item_no_near = {name} ({floor}, {zone})
where.demo_map = Yeh demo map se hai, airport ka official map nahi.
where.none = Yeh Terminal 2 ke map par nahi mila.
where.no_map = Terminal 2 ka map abhi is phone par nahi hai. Ek baar Navigate tab kholiye.
zone.after_security = security ke baad
zone.before_security = security se pehle
zone.arrivals_inside = baggage hall ki taraf
zone.arrivals_outside = bahar, exit ke baad
list.start = :
list.separator = ;
sentence.end = .

# ---- Other questions ----
help.menu = Main yeh sawaal aapke phone par hi, bina internet ke bhi, bata sakta hoon: aapka gate, boarding ka time, flight status, connection, aapka bag aur belt, bag toot jaaye ya late aaye toh kya karein, lost & found, aage kya karna hai, aur Terminal 2 mein washroom, khana, security, check-in, help desk aur lift kahan hain.
cloud.search = Main phone par flight ya hotel search nahi kar sakta. Uske liye online assistant chahiye, jo abhi chalu nahi hai.
cloud.cab = Cab ke liye Home par ride buttons use kijiye: woh jagah bharkar Uber kholte hain.
unknown = Maaf kijiye, iska jawab main abhi phone par nahi de sakta. Aise poochhiye: "Mera gate kahan hai?", "Flight time pe hai kya?", "Mera bag toot gaya", "Mera saman kho gaya" ya "Khana kahan milega?"

# ---- Times and durations ----
time.tomorrow = kal {time}
time.yesterday = pichhle din {time}
time.other_day = {date} ko {time}
duration.h_m = {h} ghante {m} minute
duration.h = {h} ghante
duration.m = {m} minute

# ---- Labels around the answer ----
source.phone = Aapke phone par jawab
source.as_of = {time} tak ki jaankari
action.NAVIGATE = Gate tak raasta
action.OPEN_MAP = Map kholiye
action.OPEN_BAGS = Bags kholiye
action.OPEN_VAULT = Document vault kholiye
action.UNLOCK_VAULT = Vault unlock kijiye
action.OPEN_HOME = Home kholiye
chip.gate = Mera gate kahan hai?
chip.boarding_close = Boarding kitne baje band hogi?
chip.bag = Mera bag kahan hai?
chip.flight = Meri flight time pe hai?
chip.washroom = Washroom kidhar hai?
chip.next = Ab kya karna hai?

# ---- Added after the demo probe. Bag-problem and Lost & Found facts come from baggage-facts.json (sourced);
# {days}, {lostDays}, {name}, {location}, {hours}, {date} and {place} are filled in by QuickAnswerer. ----
greeting = Namaste! Main OnBoard hoon. Apni flight, gate, boarding, bag ya Terminal 2 mein kisi jagah ke baare mein poochhiye.
thanks = Aapka swagat hai. Aapki yatra achhi ho!
bag.problem_damaged = Aapke bag ke liye afsos hai. Baggage hall se nikalne se pehle use airline ke baggage staff ko dikhaiye aur Property Irregularity Report (PIR) maangiye; uska reference number rakhiye.
bag.problem_not_arrived = Baggage hall se nikalne se pehle report kijiye: airline ke baggage staff se Property Irregularity Report (PIR) maangiye aur uska reference number rakhiye.
bag.problem_pilfered = Baggage hall se nikalne se pehle airline ke baggage staff ko bataiye kya gayab hai aur Property Irregularity Report (PIR) maangiye; uska reference number rakhiye.
bag.deadline_damage = Phir bag milne ke {days} din ke andar airline ko likhiye.
bag.deadline_delay = Phir bag milne ke {days} din ke andar airline ko likhiye; agar {lost_days} din baad bhi nahi aaya, toh use khoya hua maan kar claim kar sakte hain.
bag.deadline_pilfered = Phir {days} din ke andar airline ko likhiye (unse confirm kijiye).
bag.deadline_note = (Montreal Convention, international yatra; domestic flights ke liye airline ki terms dekhiye.)
bag.counter_where = Demo map par: {place}.
bag.or_lost_found = Terminal mein kahin chhoot gaya? Mujhse Lost & Found ke baare mein poochhiye.
bag.claim_help = Help tab har step batata hai aur claim pack banata hai.
lost.found = Terminal 2 ke liye {name}: {location}.
lost.hours = Timing (airport ki website se, English mein): {hours}
lost.portal = Airport ke official portal par report kijiye; Lost & Found guide aapke liye details bhar deta hai.
lost.plane = Plane mein kho gaya? Airline se contact kijiye.
lost.source = (Airport ki website, {date} ko check kiya gaya.)
lost.no_facts = Airport par kuch kho gaya? Lost & Found guide kholiye: woh batata hai kahan jaana hai aur aapke liye report bhar deta hai.
assist.wheelchair = OnBoard wheelchair book nahi kar sakta. Apni airline se maangiye: booking ke time ya check-in par sabse achha hai.
assist.desk = Aap help desk par bhi pooch sakte hain. Demo map par: {place}.
rules.carry = Aap kya saath le ja sakte hain, iske checked rules abhi mere paas nahi hain, isliye main andaaza nahi lagaunga. Please apni airline ya security staff se poochhiye.
rules.allowance = Aapka baggage allowance is phone par saved nahi hai. Yeh aapke ticket ya e-ticket par aur airline ki website par hota hai.
there.flight = Flight {flight} {departs} baje {from} se nikalegi.
there.flight_no_from = Flight {flight} {departs} baje nikalegi.
there.directions = Raste ke liye Home par directions use kijiye (Google Maps mein khulte hain); wahan ride button nikalne ka time (estimate) dikhata hai. Kitni jaldi pahunchna hai, iske liye airline ki salah maniye.
where.header_FOOD = Terminal 2 mein khana
where.header_SECURITY = Terminal 2 mein security check
where.header_CHECKIN = Terminal 2 mein check-in aur bag drop
where.header_BAGGAGE_SERVICES = Terminal 2 mein airline baggage services
where.header_BUGGY = Terminal 2 mein buggy stop
action.OPEN_HELP = Help kholiye
action.OPEN_LOST_FOUND = Lost & Found kholiye
