# Ask OnBoard Quick answers: HINGLISH (Hindi in English letters, for travellers who ask that way).
# Same keys and {placeholders} as answers_en.properties. Never write a gate, time or belt here yourself.
# Needs a native speaker's review before the demo (CLAUDE.md, phase P).

# ---- The trip itself ----
trip.missing = Aapki trip abhi is phone par save nahi hai. Internet chalu hone par ek baar Home kholiye.
flight.none = Aapki saved trip mein koi flight nahi hai.
flight.on_plan = Flight {flight} {departs} baje nikalegi aur {arrives} baje pahunchegi. Aapke saved plan mein koi badlav nahi hai.
flight.delayed = Flight {flight} late hai: ab {departs} baje nikalegi (pehle {planned} thi) aur {arrives} baje pahunchegi.
flight.changed = Flight {flight} mein badlav hua hai: ab {departs} baje nikalegi aur {arrives} baje pahunchegi.
flight.needs_you = Flight {flight} mein badlav hua hai aur aapka faisla chahiye. Chunne ke liye Home kholiye.
flight.cancelled = Flight {flight} cancel ho gayi hai. Aage kya kar sakte hain, Home par dekhiye.
flight.done = Aapke saved plan mein flight {flight} poori ho chuki hai.

# ---- Gate and boarding ----
gate.known = Aapki flight {flight} ka gate {gate} hai.
gate.changed = Gate badal gaya hai: flight {flight} ab gate {gate} se jayegi (pehle {previous} tha).
gate.not_announced = Flight {flight} ka gate abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.
gate.boarding_close = Boarding {close} baje band hogi.
gate.boarding_close_estimate = Boarding lagbhag {close} baje band hogi (estimate).
boarding.start = Flight {flight} ki boarding {start} baje shuru hogi.
boarding.start_estimate = Flight {flight} ki boarding lagbhag {start} baje shuru hogi (estimate).
boarding.start_unknown = Flight {flight} ki boarding ka time abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.
boarding.close = Flight {flight} ki boarding {close} baje band hogi.
boarding.close_estimate = Flight {flight} ki boarding lagbhag {close} baje band hogi (estimate).
boarding.close_unknown = Flight {flight} ki boarding band hone ka time abhi announce nahi hua hai. Aapki flight {departs} baje nikalegi.

# ---- Connection ----
connection.none = Aapki saved trip mein flight {flight} ke baad koi connecting flight nahi hai.
connection.gap = Flight {flight} {arrives} baje pahunchegi. Flight {next} {departs} baje nikalegi, yaani beech mein {gap} hain. Airport par itna time kaafi hai ya nahi, yeh phone nahi bata sakta: airline se poochhiye.
connection.too_late = Flight {flight} ab {arrives} baje pahunchegi, jabki flight {next} {departs} baje nikal jayegi. Apne connection ke baare mein airline se baat kijiye.
connection.first_cancelled = Flight {flight} cancel ho gayi hai, isliye apni connecting flight {next} ke baare mein airline se poochhiye.

# ---- Bags ----
bag.none = Is phone par abhi koi bag register nahi hai. Counter par dene se pehle Bags tab mein register kijiye.
bag.status = Aapka bag (tag ke aakhri ank {tag}): {status}.
bag.status_REGISTERED = register hai, abhi counter par nahi diya
bag.status_DROPPED = counter par de diya gaya
bag.status_LOADED = plane mein rakh diya gaya
bag.status_ARRIVED = aapki flight ke saath pahunch gaya
bag.status_ON_BELT = abhi belt par hai
bag.status_COLLECTED = le liya gaya
bag.status_DELAYED = late aa raha hai
bag.status_DAMAGED = kharab hone ki report hui hai
bag.status_MISSING = gum hone ki report hui hai
belt.known = Flight {flight} ke bag belt {belt} par aayenge.
belt.unknown = Flight {flight} ka baggage belt abhi announce nahi hua hai. Baggage hall ki screen par apna flight number dekhiye.

# ---- What next ----
next.airport = Aage: flight {flight} {departs} baje {from} se nikalegi. Airport par: check-in ya bag drop, phir security, phir apna gate.
next.airport_gate = Aage: flight {flight} {departs} baje {from} se nikalegi. Airport par: check-in ya bag drop, phir security, phir gate {gate}.
next.block = Aapki trip mein aage: {title}, {time} baje.
next.nothing = Aapki saved trip mein aage kuch aur nahi hai.

# ---- Documents ----
documents.vault = Aapke travel documents Document Vault mein lock rehte hain, isliye main unhe yahan nahi padhta. Expiry date dekhne ke liye Profile > More > Document vault kholiye.

# ---- Places in the terminal ----
where.header_WASHROOM = Terminal 2 mein washroom
where.header_HELP_DESK = Terminal 2 mein help desk
where.header_LIFT = Terminal 2 mein lift
where.closest_to_gate = (gate {gate} ke sabse paas wale pehle)
where.item = {name}, {near} ke paas ({floor}, {zone})
where.item_plain = {near} ke paas ({floor}, {zone})
where.item_no_near = {name} ({floor}, {zone})
where.demo_map = Yeh demo map se hai, airport ka official map nahi.
where.none = Yeh Terminal 2 ke map par nahi mila.
where.no_map = Terminal 2 ka map abhi is phone par nahi hai. Ek baar Navigate tab kholiye.
zone.after_security = security ke baad
zone.before_security = security se pehle
zone.arrivals_inside = baggage hall ki taraf
zone.arrivals_outside = bahar, exit ke baad
list.start = :
list.separator = ;
sentence.end = .

# ---- Other questions ----
help.menu = Main yeh sawaal aapke phone par hi, bina internet ke bhi, bata sakta hoon: aapka gate, boarding ka time, flight status, connection, aapka bag aur belt, aage kya karna hai, aur Terminal 2 mein washroom, help desk aur lift kahan hain.
cloud.search = Main phone par flight ya hotel search nahi kar sakta. Uske liye online assistant chahiye, jo abhi chalu nahi hai.
cloud.cab = Cab ke liye Home par ride buttons use kijiye: woh jagah bharkar Uber kholte hain.
unknown = Maaf kijiye, main samjha nahi. Apne gate, boarding, flight, bag ya washroom ke baare mein poochhiye.

# ---- Times and durations ----
time.tomorrow = kal {time}
time.yesterday = pichhle din {time}
time.other_day = {date} ko {time}
duration.h_m = {h} ghante {m} minute
duration.h = {h} ghante
duration.m = {m} minute

# ---- Labels around the answer ----
source.phone = Aapke phone par jawab
source.as_of = {time} tak ki jaankari
action.NAVIGATE = Gate tak raasta
action.OPEN_MAP = Map kholiye
action.OPEN_BAGS = Bags kholiye
action.OPEN_VAULT = Document vault kholiye
action.OPEN_HOME = Home kholiye
chip.gate = Mera gate kahan hai?
chip.boarding_close = Boarding kitne baje band hogi?
chip.bag = Mera bag kahan hai?
chip.flight = Meri flight time pe hai?
chip.washroom = Washroom kidhar hai?
chip.next = Ab kya karna hai?
