# Ask OnBoard Quick answers: ENGLISH. The reference file: every other language has the same keys.
# {name} = a value the app's code puts in from saved data (gate, time, flight number...). Never write a gate, a time
# or a belt into a sentence yourself: if the data is missing, the code uses the "not announced" sentence instead.
# AnswerTextTest checks that every language has every key with the same {placeholders}.

# ---- The trip itself ----
trip.missing = Your trip isn't saved on this phone yet. Open Home once while you're online to load it.
flight.none = There's no flight in your saved trip.
flight.on_plan = {flight} departs at {departs} and lands at {arrives}. No change in your saved plan.
flight.delayed = {flight} is late: it now departs at {departs} (planned {planned}) and lands at {arrives}.
flight.changed = {flight} has changed: it now departs at {departs} and lands at {arrives}.
flight.needs_you = {flight} has changed and needs your decision. Open Home to choose.
flight.cancelled = {flight} is cancelled. Open Home to see what you can do.
flight.done = {flight} is completed in your saved plan.

# ---- Gate and boarding (no gate source until phase G4, so "not announced" for now) ----
gate.known = Your gate for {flight} is {gate}.
gate.changed = Gate changed: {flight} now leaves from gate {gate} (it was {previous}).
gate.not_announced = The gate for {flight} is not announced yet. Your flight departs at {departs}.
gate.boarding_close = Boarding closes at {close}.
gate.boarding_close_estimate = Boarding closes at about {close} (estimate).
boarding.start = Boarding for {flight} starts at {start}.
boarding.start_estimate = Boarding for {flight} starts at about {start} (estimate).
boarding.start_unknown = The boarding time for {flight} is not announced yet. Your flight departs at {departs}.
boarding.close = Boarding for {flight} closes at {close}.
boarding.close_estimate = Boarding for {flight} closes at about {close} (estimate).
boarding.close_unknown = The boarding close time for {flight} is not announced yet. Your flight departs at {departs}.

# ---- Connection ----
connection.none = Your saved trip has no connecting flight after {flight}.
connection.gap = {flight} lands at {arrives}. {next} departs at {departs}, so you have {gap} between them. The phone can't tell whether that's enough time at the airport: check with the airline.
connection.too_late = {flight} now lands at {arrives}, after {next} departs at {departs}. Talk to the airline about your connection.
connection.first_cancelled = {flight} is cancelled, so ask the airline about your connecting flight {next}.

# ---- Bags (no bag records until phase B1) ----
bag.none = No bag is registered on this phone yet. Register it in the Bags tab before you hand it over at the counter.
bag.status = Your bag (tag ending {tag}): {status}.
bag.status_REGISTERED = registered, not handed over yet
bag.status_DROPPED = handed over at the counter
bag.status_LOADED = loaded on the plane
bag.status_ARRIVED = arrived with your flight
bag.status_ON_BELT = on the belt now
bag.status_COLLECTED = collected
bag.status_DELAYED = delayed
bag.status_DAMAGED = reported damaged
bag.status_MISSING = reported missing
belt.known = Bags from {flight} come on belt {belt}.
belt.unknown = The baggage belt for {flight} is not announced yet. Look for your flight number on the screens in the baggage hall.

# ---- What next ----
next.airport = Next: {flight} departs at {departs} from {from}. At the airport: check-in or bag drop, then security, then your gate.
next.airport_gate = Next: {flight} departs at {departs} from {from}. At the airport: check-in or bag drop, then security, then gate {gate}.
next.block = Next in your trip: {title} at {time}.
next.nothing = Nothing else is planned in your saved trip.

# ---- Documents: summaries from the Document Vault (type, first name, dates, countries, status; never numbers) ----
documents.not_available = There's no Document Vault on this phone yet, so I can't check your documents.
documents.locked = Your Document Vault is locked. Unlock it to see this.
documents.your_vault = your vault
documents.none_of_type = No {document} is saved in {trip}.
documents.all_ready = All {count} saved documents in {trip} are ready.
documents.attention = Needs your attention in {trip}: {items}
documents.list = In {trip}: {items}
documents.sample = SAMPLE
documents.requirements_note = I can't tell which documents a country requires: check with the airline or embassy.
doc.kind_PASSPORT = passport
doc.kind_VISA = visa
doc.kind_INSURANCE = travel insurance
doc.PASSPORT = Passport
doc.ID_CARD = ID card
doc.VISA = Visa
doc.E_VISA = E-visa
doc.TRANSIT_VISA = Transit visa
doc.ENTRY_FORM = Entry form
doc.TICKET = Ticket
doc.BOARDING_PASS = Boarding pass
doc.HOTEL = Hotel booking
doc.INSURANCE = Travel insurance
doc.VACCINATION_CERT = Vaccination certificate
doc.OTHER = Document
doc.for_country = {document} for {country}
doc.line = {document}: {validity}, {status}
doc.line_named = {document} ({name}): {validity}, {status}
doc.valid_until = valid until {date}
doc.no_date = no date saved
status.READY = ready
status.EXPIRES_SOON = expires soon ({days} days left)
status.EXPIRED = expired
status.MISMATCH = the name doesn't match the trip, please check
status.NOT_OFFLINE_YET = not yet checked for offline use
status.MISSING = its saved file is missing on this phone, add it again

# ---- Places in the terminal (from the demo map) ----
where.header_WASHROOM = Washrooms in Terminal 2
where.header_HELP_DESK = Help desks in Terminal 2
where.header_LIFT = Lifts in Terminal 2
where.closest_to_gate = (closest to gate {gate} first)
where.item = {name} near {near} ({floor}, {zone})
where.item_plain = near {near} ({floor}, {zone})
where.item_no_near = {name} ({floor}, {zone})
where.demo_map = From the demo map, not an official airport map.
where.none = I couldn't find that on the Terminal 2 map.
where.no_map = The Terminal 2 map isn't on this phone yet. Open the Navigate tab once to load it.
zone.after_security = after security
zone.before_security = before security
zone.arrivals_inside = baggage hall side
zone.arrivals_outside = outside, after the exit
list.start = :
list.separator = ;
sentence.end = .

# ---- Other questions ----
help.menu = I can answer these on your phone, even offline: your gate, boarding times, flight status, your connection, your bag and belt, what to do if a bag is damaged or late, lost & found, what to do next, and where washrooms, food, security, check-in, help desks and lifts are in Terminal 2.
cloud.search = I can't search flights or hotels on the phone. That needs the online assistant, which isn't switched on yet.
cloud.cab = To get a cab, use the ride buttons on Home: they open Uber with the places filled in.
unknown = Sorry, I can't answer that on the phone yet. Try: "Where is my gate?", "Is my flight on time?", "My bag is damaged", "I lost something" or "Where can I eat?"

# ---- Times and durations ----
time.tomorrow = {time} tomorrow
time.yesterday = {time} yesterday
time.other_day = {time} on {date}
duration.h_m = {h} h {m} min
duration.h = {h} h
duration.m = {m} min

# ---- Labels around the answer (chip under the reply, buttons, quick questions) ----
source.phone = Answered on your phone
source.as_of = as of {time}
action.NAVIGATE = Navigate to gate
action.OPEN_MAP = Open the map
action.OPEN_BAGS = Open Bags
action.OPEN_VAULT = Open Document vault
action.UNLOCK_VAULT = Unlock vault
action.OPEN_HOME = Open Home
chip.gate = Where is my gate?
chip.boarding_close = When does boarding close?
chip.bag = Where is my bag?
chip.flight = Is my flight on time?
chip.washroom = Where are the washrooms?
chip.next = What should I do next?

# ---- Added after the demo probe. Bag-problem and Lost & Found facts come from baggage-facts.json (sourced);
# {days}, {lostDays}, {name}, {location}, {hours}, {date} and {place} are filled in by QuickAnswerer. ----
greeting = Hi! I'm OnBoard. Ask me about your flight, gate, boarding, bags, or where things are in Terminal 2.
thanks = You're welcome. Have a good trip!
bag.problem_damaged = Sorry about your bag. Before you leave the baggage hall, show it to the airline's baggage staff and ask for a Property Irregularity Report (PIR); keep its reference number.
bag.problem_not_arrived = Report it before you leave the baggage hall: ask the airline's baggage staff for a Property Irregularity Report (PIR) and keep its reference number.
bag.problem_pilfered = Before you leave the baggage hall, tell the airline's baggage staff what is missing and ask for a Property Irregularity Report (PIR); keep its reference number.
bag.deadline_damage = Then write to the airline within {days} days of getting the bag.
bag.deadline_delay = Then write to the airline within {days} days of getting the bag; if it still hasn't come after {lost_days} days, you can claim it as lost.
bag.deadline_pilfered = Then write to the airline within {days} days (confirm with them).
bag.deadline_note = (Montreal Convention, international trips; for domestic flights check the airline's terms.)
bag.counter_where = On the demo map: {place}.
bag.or_lost_found = Left it somewhere in the terminal? Ask me about Lost & Found.
bag.claim_help = The Help tab walks you through it and makes a claim pack.
lost.found = {name} for Terminal 2: {location}.
lost.hours = {hours}
lost.portal = Report it on the airport's official portal; the Lost & Found guide fills in the details for you.
lost.plane = Lost it on the plane? Contact the airline.
lost.source = (Airport website, checked {date}.)
lost.no_facts = Lost something at the airport? Open the Lost & Found guide: it says where to go and fills in the report for you.
assist.wheelchair = OnBoard can't book wheelchair help. Ask your airline for it: best when you book, or at check-in.
assist.desk = You can also ask at a help desk. On the demo map: {place}.
rules.carry = I don't have checked rules about what you can carry yet, so I won't guess. Please ask your airline or the security staff.
rules.allowance = Your baggage allowance isn't saved on this phone. It's on your ticket or e-ticket, and on the airline's website.
there.flight = {flight} departs at {departs} from {from}.
there.flight_no_from = {flight} departs at {departs}.
there.directions = For the drive, use the directions on Home (they open Google Maps); the ride button there shows a leave-by time (estimate). How early to arrive: follow your airline's advice.
where.header_FOOD = Food in Terminal 2
where.header_SECURITY = Security check in Terminal 2
where.header_CHECKIN = Check-in and bag drop in Terminal 2
where.header_BAGGAGE_SERVICES = Airline baggage services in Terminal 2
where.header_BUGGY = Buggy stops in Terminal 2
action.OPEN_HELP = Open Help
action.OPEN_LOST_FOUND = Open Lost & Found
