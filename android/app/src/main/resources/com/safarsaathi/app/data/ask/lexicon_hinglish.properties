# Ask OnBoard lexicon: HINGLISH (Hindi written in English letters, e.g. "Mera gate kahan hai?").
# Same format as lexicon_en.properties. List the common spellings: there is no standard way to write Hindi in English
# letters (kahan / kaha / kahaan, saman / samaan). "get" is a very common typo for "gate", but also an English word
# ("get me a cab"), so it only counts inside phrases here.
# Language markers need a native speaker's review before the demo (CLAUDE.md, phase P).

