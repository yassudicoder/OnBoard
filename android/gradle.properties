# Project-wide Gradle settings (shared by the whole team, so it is committed).
# Personal, per-laptop settings (SDK path, API keys) go in local.properties instead, which is NOT committed.

# Memory for the Gradle build process. 2 GB is plenty for this app and still fits on laptops
# with little free RAM. -Dfile.encoding=UTF-8 makes Gradle read our files as UTF-8 on Windows too.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the AndroidX libraries (the modern replacement for the old "support" libraries).
android.useAndroidX=true

# Each module's R class only lists that module's own resources (smaller R classes, faster builds).
android.nonTransitiveRClass=true

# AGP 9 would otherwise wire in Kotlin compilation; our app code is Java-only.
# (The build files are Kotlin script, .kts, but that is run by Gradle itself and is not affected by this.)
# Expected: every build prints "WARNING: The option setting 'android.builtInKotlin=false' is deprecated".
# That is fine for AGP 9; delete this line when the project moves to AGP 10, which removes the option.
android.builtInKotlin=false

# Note: Gradle's "configuration cache" is deliberately left OFF. It speeds up big builds but adds
# extra rules for build scripts; for a small team project, simpler is better.
