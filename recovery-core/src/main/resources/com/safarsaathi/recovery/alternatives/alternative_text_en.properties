# The sentences that describe alternatives, in English. Read by AlternativeRanker through Sentences.
# {name} is filled in by the code: keep every {name} when translating (alternative_text_hi / _mr come in C3/C4).
# A label such as " (SAMPLE fare)" starts with "\ " because a properties file drops a plain leading space.

# One option in a sentence.
arrives=Arrives in {city} at {time} ({delay}), {stops}.
delay_none=no later than planned
delay_later={duration} later than planned
stops_none=no change of planes
stops_one=1 change of planes in {city}
stops_many={count} changes of planes

# Why the recommended option.
why_earliest=Recommended: the earliest arrival.
why_earliest_checked=Recommended: the earliest arrival with a checked connection time.
why_fewer_stops_one=Recommended: {other} arrives {difference} earlier but needs 1 more change of planes.
why_fewer_stops_many=Recommended: {other} arrives {difference} earlier but needs {count} more changes of planes.
why_cheaper=Recommended: {other} arrives {difference} earlier but costs about ₹{amount} more{fareLabel}.
why_balance=Recommended as the best balance of arrival time, changes of planes and cost.
skipped_unchecked=An earlier option via {city} is not recommended: its connection time is not checked.
none_checked=No option has a checked connection time: ask the airline whether this connection works.

# The other options.
connection_not_checked=connection time not checked
not_checked_detail=Connection time not checked: OnBoard has no minimum connection time for {city}.
tight=Tight connection in {city}.

# Routes that fail a minimum connection time.
rejected=Not offered: the time to change planes in {city} is too short. {checkReason}

# Notes on an option.
transit_none=No change of planes, so no transit visa question.
transit_unknown=Transit visa: UNKNOWN, check transit requirements for {cities}.
transit_required=A transit visa is required in {cities}.
seats_verified=Seats checked by the provider.
seats_unknown=Availability unknown
separate_tickets=Separate tickets: if one flight is late the other airline may not wait, and your bags may not be transferred.
fare_new_ticket=New ticket about ₹{amount}{fareLabel}. Whether your old ticket is refunded depends on its rules.
sample_fare_label=\ (SAMPLE fare)

time_on_day={time} on {date}
date_pattern=d MMM
duration_minutes={minutes} min
duration_hours={hours} h
duration_hours_minutes={hours} h {minutes} min
