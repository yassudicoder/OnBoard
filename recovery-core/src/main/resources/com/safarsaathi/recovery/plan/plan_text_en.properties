# The sentences of a recovery plan (next steps, overnight advice), in English. Read by RecoverySteps and
# OvernightAdvice through Sentences. {name} is filled in by the code: keep every {name} when translating
# (plan_text_hi / _mr come in C3/C4). A part that starts with a space starts with "\ " (properties files drop a plain
# leading space). Never promise meals, a hotel, compensation or a seat in these sentences.

# 1. Has the airline already rebooked you?
check_rebooking_single=Check whether {airline} has already rebooked you: look in the airline's app, email and SMS. On one ticket the airline is normally responsible for getting you to {destination}.
check_rebooking_separate=Your tickets are separate, so {airline} may treat you as a no-show. Check your messages, then contact {airline} as early as you can.
check_rebooking_unknown=Check whether the airline has already rebooked you (app, email, SMS). Tell OnBoard whether both flights are on one ticket: it changes the advice.
rebooked=The airline has rebooked you on {flight}{when}. Check the new booking in the airline's app or email, then accept it or ask for one of the alternatives.
rebooked_when=, leaving {city} at {time}
# 2. Ask the airline.
ask_airline=Ask the airline to rebook you or refund you: OnBoard prepares the request for you to send from your own email or chat app.
ask_airline_rebooked=If the new flight doesn't work for you, ask the airline for another one or a refund: OnBoard prepares the request.
# 3. Compare alternatives.
compare=Compare the alternatives: OnBoard recommends {flights}, arriving in {destination} at {arrives}.{sample}
compare_none=OnBoard found no suitable alternative in the next {hours} hours: ask the airline.
compare_sample_label=\ The alternatives are SAMPLE DATA.
# 4. Transit and visa.
transit=Check transit and visa rules for the route you choose.{status}
transit_status_unknown=\ For the recommended route: transit visa UNKNOWN, check transit requirements.
transit_status_none=\ The recommended route has no change of planes.
transit_status_required=\ The recommended route needs a transit visa.
# 5. Overnight.
overnight=Your next suitable flight is not until {time}: see below what {airline} provides{unknown}. Keep all receipts.
overnight_unknown=\ (not known: ask the airline)
# 6. Confirm.
confirm=Confirm your choice. Nothing is booked or paid until you approve the price and conditions.

# Where to go now.
at_hub=On arrival in {city}: follow signs to Transfers, go to the airline's transfer desk and show this screen. If it is closed, use the contact channels below.
at_departure=At {city} airport: ask at the {airline} counter, or use the contact channels below.

# Overnight advice.
overnight_reason=Your next suitable flight leaves {city} at {time}, {wait} after you could leave.
policy_unknown=Ask the airline whether meals, a hotel or transport are provided under your ticket.
keep_receipts=Keep all receipts (meals, hotel, transport).
no_hotel_booking=OnBoard never books a hotel without your explicit approval.
overnight_separate=Your tickets are separate: the airline of your next flight is usually not responsible for the missed connection. Ask {airline} what it provides for its delay.
leaving_transit=To leave the transit area in {city} for a hotel you may need permission to enter the country: check before you leave.
request_line=As the next suitable flight is not until {time}, please confirm whether meals, hotel accommodation and transport are provided under my ticket.

time_on_day={time} on {date}
date_pattern=d MMM
duration_minutes={minutes} min
duration_hours={hours} h
duration_hours_minutes={hours} h {minutes} min
