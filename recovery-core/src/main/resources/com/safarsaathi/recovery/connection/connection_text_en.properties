# The sentences OnBoard uses to explain a connection's status, in English. Read by ConnectionText.
# {name} is filled in by ConnectionChecker: keep every {name} when translating (connection_text_hi.properties and
# connection_text_mr.properties come in C3/C4). Times are local airport times, e.g. "21:10" or "00:40 on 12 Oct".
# A label such as " (demo value)" starts with "\ " because a properties file drops a plain leading space.

lands_and_leaves=You land in {city} at {lands}, your next flight leaves at {leaves}.
needs_and_have={city} needs at least {mct} min{mctLabel}. You have {available} min.
terminals_assumed=Your terminals are not known yet, so this uses the minimum for changing terminals.
at_risk_spare=That leaves only {spare} min to spare: taxiing, getting off the plane and transfer security take about {transfer} min{transferLabel}, and the gate closes {gateClose} min before departure{gateCloseLabel}.
at_risk_late=By our estimate you reach the gate about {late} min after it closes: taxiing, getting off the plane and transfer security take about {transfer} min{transferLabel}, and the gate closes {gateClose} min before departure{gateCloseLabel}.
unknown_mct=OnBoard has no official minimum connection time for {city} ({type}), so it can't tell whether {available} min is enough. Ask the airline.
unknown_airport=OnBoard has no data about the airport {airport}, so it can't tell whether {available} min is enough. Ask the airline.
other_airport=Your next flight leaves from {nextAirport}, not from {airport}. OnBoard can't check a change of airports yet: ask the airline.
leaves_before_landing=Your next flight is due to leave {city} at {leaves}, before you land at {lands}.
cancelled_inbound=Your flight {flight} from {from} to {city} is cancelled.
cancelled_outbound=Your onward flight {flight} from {city} to {to} is cancelled.
confirmed_missed_departed=Your next flight {flight} has left {city} before you could get there.
confirmed_missed=Your connection in {city} is confirmed missed.
rebooked=The airline has rebooked you on {flight}.
resolved=This connection is sorted.

label_OFFICIAL=
label_DEMO_VALUE=\ (demo value)
label_ESTIMATE=\ (estimate)

type_DOM_DOM=domestic to domestic
type_DOM_INTL=domestic to international
type_INTL_DOM=international to domestic
type_INTL_INTL=international to international
type_unknown=this kind of connection

time_on_day={time} on {date}
date_pattern=d MMM
