# Route instructions, English. {0} = the place's name, {1} = the floor's name (only for lifts, escalators, stairs).
# Read by InstructionText (UTF-8). Keep the same keys in instructions_hi.properties and instructions_mr.properties.
depart=Head towards {0}
slight_left=Keep left at {0}
left=Turn left at {0}
sharp_left=Turn sharp left at {0}
slight_right=Keep right at {0}
right=Turn right at {0}
sharp_right=Turn sharp right at {0}
u_turn=Turn around at {0}
security=Go through {0}
travelator=Take the travelator towards {0}
lift_up=Take {0} up to {1}
lift_down=Take {0} down to {1}
escalator_up=Take the escalator up to {1}
escalator_down=Take the escalator down to {1}
stairs_up=Take the stairs up to {1}
stairs_down=Take the stairs down to {1}
arrive=Arrive at {0}
arrived=You have arrived at {0}
