# Route instructions, Marathi. {0} = the place's name, {1} = the floor's name. Same keys as instructions_en.properties.
# To be reviewed by a native speaker in phase P.
depart={0} च्या दिशेने चला
slight_left={0} जवळ किंचित डावीकडे राहा
left={0} जवळ डावीकडे वळा
sharp_left={0} जवळ पूर्ण डावीकडे वळा
slight_right={0} जवळ किंचित उजवीकडे राहा
right={0} जवळ उजवीकडे वळा
sharp_right={0} जवळ पूर्ण उजवीकडे वळा
u_turn={0} जवळ मागे वळा
security={0} मधून पुढे जा
travelator={0} च्या दिशेने ट्रॅव्हलेटर घ्या
lift_up={0} ने वर {1} मजल्यावर जा
lift_down={0} ने खाली {1} मजल्यावर जा
escalator_up=सरकत्या जिन्याने वर {1} मजल्यावर जा
escalator_down=सरकत्या जिन्याने खाली {1} मजल्यावर जा
stairs_up=जिन्याने वर {1} मजल्यावर जा
stairs_down=जिन्याने खाली {1} मजल्यावर जा
arrive={0} येथे पोहोचा
arrived=तुम्ही {0} येथे पोहोचलात
